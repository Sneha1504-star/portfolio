/* ------------------------ REUSABLE UI ------------------------ */

function Reveal({ children, delay = 0, className = "" }: { children: React.ReactNode; delay?: number; className?: string }) {
  const ref = useRef<HTMLDivElement>(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setShown(true); io.disconnect(); }
    }, { threshold: 0.1 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div ref={ref} style={{ transitionDelay: `${delay}ms` }} className={`reveal ${shown ? "reveal-in" : ""} ${className}`}>
      {children}
    </div>
  );
}

type BtnProps = { children: React.ReactNode; icon?: string; variant?: "primary" | "ghost"; onClick?: () => void; href?: string; className?: string; type?: "button" | "submit" };

function Btn({ children, icon, variant = "primary", onClick, href, className = "", type = "button" }: BtnProps) {
  const base = `inline-flex min-h-[46px] items-center justify-center gap-2 rounded-xl px-5 text-sm font-semibold ${
    variant === "primary" ? "btn-primary text-white" : "btn-ghost glass text-[#F3F1FA]"
  } ${className}`;
  const inner = (<>{icon && <Icon name={icon} size={16} />}{children}</>);
  if (href) return <a href={href} target="_blank" rel="noopener noreferrer" className={base}>{inner}</a>;
  return <button type={type} onClick={onClick} className={base}>{inner}</button>;
}

/* A link button that explains itself while its URL is still a placeholder. */
function LinkBtn({ url, label, children, icon, variant = "ghost", className = "" }: { url: string; label: string; children: React.ReactNode; icon?: string; variant?: "primary" | "ghost"; className?: string }) {
  if (url) return <Btn href={url} icon={icon} variant={variant} className={className}>{children}</Btn>;
  return (
    <Btn icon={icon} variant={variant} className={className}
      onClick={() => toast(`${label} link isn't added yet. Add it in the CONFIG block at the top of the source.`)}>
      {children}
    </Btn>
  );
}

function ToastHost() {
  const [msg, setMsg] = useState("");
  useEffect(() => {
    let t: any;
    const on = (e: Event) => {
      setMsg((e as CustomEvent).detail as string);
      clearTimeout(t);
      t = setTimeout(() => setMsg(""), 3800);
    };
    window.addEventListener("app-toast", on);
    return () => { window.removeEventListener("app-toast", on); clearTimeout(t); };
  }, []);
  if (!msg) return null;
  return (
    <div role="status" aria-live="polite" className="pop fixed bottom-6 left-1/2 z-[70] w-[min(92vw,460px)] -translate-x-1/2 rounded-xl border border-white/15 bg-[#1A1626]/95 px-4 py-3 text-sm shadow-2xl backdrop-blur"
      style={{ marginBottom: "env(safe-area-inset-bottom, 0px)" }}>
      {msg}
    </div>
  );
}

function Navbar() {

  useEffect(() => {
    const on = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setProgress(max > 0 ? (h.scrollTop / max) * 100 : 0);
      setScrolled(h.scrollTop > 12);
    };
    on();
    window.addEventListener("scroll", on, { passive: true });

    <header className={`sticky z-50 transition-colors ${scrolled || open ? "bg-ink/80 backdrop-blur-xl" : ""}`} style={{ top: "env(safe-area-inset-top, 0px)" }}>

function ProjectCard({ p, onOpen }: { p: Project; onOpen: (p: Project) => void }) {
  const ref = useRef<HTMLElement>(null);
  const onMove = (e: React.PointerEvent<HTMLElement>) => {
    const el = ref.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width;
    const y = (e.clientY - r.top) / r.height;
    el.style.setProperty("--mx", `${x * 100}%`);
    el.style.setProperty("--my", `${y * 100}%`);
    if (e.pointerType === "mouse") {
      el.style.transform = `perspective(900px) rotateX(${(0.5 - y) * 6}deg) rotateY(${(x - 0.5) * 8}deg) translateY(-4px)`;
    }
  };
  const onLeave = () => { if (ref.current) ref.current.style.transform = ""; };
  return (
    <article ref={ref} onPointerMove={onMove} onPointerLeave={onLeave}
      className="tilt glass relative flex h-full flex-col rounded-2xl p-6">
      <div className="flex items-start justify-between gap-3">
        <span className="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-gradient-to-br from-iris/40 to-fuchsia-500/20 text-white ring-1 ring-white/15"><Icon name={p.icon} size={24} /></span>

      </div>
      <h3 className="mt-5 font-display text-lg font-semibold leading-snug">{p.title}</h3>
      <p className="mt-1 text-sm text-lilac">{p.tagline}</p>
      <p className="mt-4 flex-1 text-sm leading-relaxed text-mist">{p.description}</p>
      <div className="mt-5 flex flex-wrap gap-2">
        {p.stack.map((s) => <Chip key={s}>{s}</Chip>)}

      <div className="relative z-10 mt-6 flex flex-wrap gap-3">
        <Btn icon="Info" onClick={() => onOpen(p)} className="flex-1">Project Details</Btn>
        <LinkBtn url={p.github} label={`${p.title} GitHub`} icon="Github" className="flex-1">GitHub</LinkBtn>
      </div>
    </article>
  );
}

    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = prev; };

  return (
    <div className="fixed inset-0 z-[65] flex items-end justify-center bg-black/70 p-0 backdrop-blur-sm sm:items-center sm:p-6" onClick={onClose}>

            className="relative flex max-h-[95vh] w-full max-w-6xl flex-col overflow-hidden rounded-2xl border border-white/15 bg-[#111118] shadow-2xl"
            onClick={(e) => e.stopPropagation()}
          >
            {/* Modal Header */}
            <div className="flex items-center justify-between gap-4 border-b border-white/10 px-4 py-3 sm:px-6">
              <div className="min-w-0">
                <h3 className="truncate text-sm font-semibold text-white sm:text-base">
                  {selectedCertificate.title}
                </h3>

                <p className="text-xs text-mist">
                  {selectedCertificate.issuer}
                </p>
              </div>

              <button
                type="button"
                onClick={() => setSelectedCertificate(null)}
                className="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-white/15 text-white transition hover:bg-white/10"
                aria-label="Close certificate"
              >
                <Icon name="X" size={20} />
              </button>
            </div>

            {/* Full Certificate Image */}
            <div className="flex min-h-0 flex-1 items-center justify-center overflow-auto bg-[#252525] p-3 sm:p-6">
              <img
                src={selectedCertificate.image}
                alt={selectedCertificate.title}
                className="max-h-[80vh] max-w-full rounded-lg object-contain"
              />
            </div>

          </div>
        </div>
      )}
    </>
  );
}

/* ---------------------------- CONTACT ---------------------------- */

function Contact() {
  const [form, setForm] = useState({ name: "", email: "", message: "" });
  const [errors, setErrors] = useState<Record<string, string>>({});
  const [sent, setSent] = useState(false);

  const subject = `Portfolio enquiry from ${form.name || "a visitor"}`;
  const body = `${form.message}\n\nFrom: ${form.name} <${form.email}>`;
  const mailto = `mailto:${PROFILE.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

  const validate = () => {
    const e: Record<string, string> = {};
    if (form.name.trim().length < 2) e.name = "Please enter your name.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim())) e.email = "Please enter a valid email address.";
    if (form.message.trim().length < 10) e.message = "Please write at least a short message (10+ characters).";
    setErrors(e);
    return Object.keys(e).length === 0;
  };

  const submit = (ev: React.FormEvent) => {
    ev.preventDefault();
    if (!validate()) return;
    setSent(true);
    const a = document.createElement("a");
    a.href = mailto;
    a.click();
  };

  const field = "w-full rounded-xl border bg-white/[0.04] px-4 py-3 text-[15px] text-white placeholder:text-white/35 transition-colors focus:border-lilac/70 focus:bg-white/[0.07] focus:outline-none";
  const set = (k: string) => (e: React.ChangeEvent<HTMLInputElement | HTMLTextAreaElement>) => {
    setForm({ ...form, [k]: e.target.value });
    if (errors[k]) setErrors({ ...errors, [k]: "" });
  };

  return (
    <Section id="contact" eyebrow="Contact" title="Let's work together">
      <div className="grid gap-6 lg:grid-cols-[1fr_1.2fr]">
        <Reveal>
          <div className="grid gap-4">
            <div className="glass flex items-center gap-4 rounded-2xl p-5">
              <span className="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-iris/20 text-lilac"><Icon name="Mail" size={20} /></span>
              <div className="min-w-0 flex-1">
                <p className="text-xs uppercase tracking-wider text-mist">Email</p>
                <p className="truncate text-[15px] font-medium">{PROFILE.email}</p>
              </div>
              <button type="button" aria-label="Copy email address" onClick={() => copyText(PROFILE.email, "Email address copied.")} className="btn-ghost glass inline-flex h-10 w-10 items-center justify-center rounded-xl"><Icon name="Copy" size={16} /></button>
            </div>
            <a href={PROFILE.linkedin} target="_blank" rel="noopener noreferrer" className="glass flex items-center gap-4 rounded-2xl p-5 transition-transform hover:-translate-y-0.5">
              <span className="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-iris/20 text-lilac"><Icon name="Linkedin" size={20} /></span>
              <div className="min-w-0 flex-1"><p className="text-xs uppercase tracking-wider text-mist">LinkedIn</p><p className="truncate text-[15px] font-medium">sneha-waghamore</p></div>
              <Icon name="ExternalLink" size={16} className="text-mist" />
            </a>
            <a href={PROFILE.leetcode} target="_blank" rel="noopener noreferrer" className="glass flex items-center gap-4 rounded-2xl p-5 transition-transform hover:-translate-y-0.5">
              <span className="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-iris/20 text-lilac"><Icon name="Code2" size={20} /></span>
              <div className="min-w-0 flex-1"><p className="text-xs uppercase tracking-wider text-mist">LeetCode</p><p className="truncate text-[15px] font-medium">sneha_1522</p></div>
              <Icon name="ExternalLink" size={16} className="text-mist" />
            </a>
            {PROFILE.github ? (
              <a href={PROFILE.github} target="_blank" rel="noopener noreferrer" className="glass flex items-center gap-4 rounded-2xl p-5 transition-transform hover:-translate-y-0.5">
                <span className="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-iris/20 text-lilac"><Icon name="Github" size={20} /></span>
                <div className="min-w-0 flex-1"><p className="text-xs uppercase tracking-wider text-mist">GitHub</p><p className="truncate text-[15px] font-medium">{PROFILE.github.replace("https://", "")}</p></div>
                <Icon name="ExternalLink" size={16} className="text-mist" />
              </a>
            ) : (
              <button type="button" onClick={() => toast("GitHub link isn't added yet. Add it in the CONFIG block at the top of the source.")} className="glass flex w-full items-center gap-4 rounded-2xl border-dashed p-5 text-left transition-transform hover:-translate-y-0.5">
                <span className="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-iris/20 text-lilac"><Icon name="Github" size={20} /></span>
                <div className="min-w-0 flex-1"><p className="text-xs uppercase tracking-wider text-mist">GitHub</p><p className="text-[15px] font-medium text-mist">Placeholder: add your profile link</p></div>
              </button>
            )}
          </div>
        </Reveal>

        <Reveal delay={120}>
          <form onSubmit={submit} noValidate className="glass rounded-2xl p-6 sm:p-8" aria-label="Contact form">
            {sent ? (
              <div className="pop text-center">
                <span className="mx-auto inline-flex h-14 w-14 items-center justify-center rounded-full bg-iris/25 text-lilac"><Icon name="CheckCircle2" size={28} /></span>
                <h3 className="mt-4 font-display text-xl font-semibold">Your email app should open</h3>
                <p className="mx-auto mt-2 max-w-sm text-sm text-mist">The message is filled in and addressed to {PROFILE.email}. If nothing opened, copy it and send it from your own email.</p>
                <div className="mt-6 flex flex-wrap justify-center gap-3">
                  <Btn icon="Copy" onClick={() => copyText(`To: ${PROFILE.email}\nSubject: ${subject}\n\n${body}`, "Message copied.")}>Copy message</Btn>
                  <Btn variant="ghost" onClick={() => { setSent(false); setForm({ name: "", email: "", message: "" }); }}>Write another</Btn>
                </div>
              </div>
            ) : (
              <div className="grid gap-5">
                <div>
                  <label htmlFor="cf-name" className="mb-2 block text-sm font-medium">Name</label>
                  <input id="cf-name" value={form.name} onChange={set("name")} autoComplete="name" placeholder="Your name" aria-invalid={!!errors.name}
                    className={`${field} ${errors.name ? "border-rose-400/70" : "border-white/10"}`} />
                  {errors.name && <p className="mt-1.5 text-xs text-rose-300">{errors.name}</p>}
                </div>
                <div>
                  <label htmlFor="cf-email" className="mb-2 block text-sm font-medium">Email</label>
                  <input id="cf-email" type="email" value={form.email} onChange={set("email")} autoComplete="email" placeholder="you@company.com" aria-invalid={!!errors.email}
                    className={`${field} ${errors.email ? "border-rose-400/70" : "border-white/10"}`} />
                  {errors.email && <p className="mt-1.5 text-xs text-rose-300">{errors.email}</p>}
                </div>
                <div>
                  <label htmlFor="cf-message" className="mb-2 block text-sm font-medium">Message</label>
                  <textarea id="cf-message" rows={5} value={form.message} onChange={set("message")} placeholder="Tell me about the role or project…" aria-invalid={!!errors.message}
                    className={`${field} resize-y ${errors.message ? "border-rose-400/70" : "border-white/10"}`} />
                  {errors.message && <p className="mt-1.5 text-xs text-rose-300">{errors.message}</p>}
                </div>
                <Btn type="submit" icon="Send" className="w-full sm:w-auto">Send message</Btn>
                <p className="text-xs text-mist">Sending opens your email app with this message addressed to me.</p>
              </div>
            )}
          </form>
        </Reveal>
      </div>
    </Section>
  );
}

ReactDOM.createRoot(document.getElementById("root")!).render(<App />);
</script>

<script>
(function () {
  var root = document.getElementById('root');
  function fail(msg) {
    root.innerHTML = '<pre style="padding:24px;color:#fca5a5;white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace">' + String(msg).replace(/</g, '&lt;') + '</pre>';
  }
  try {
    if (!window.Babel) throw new Error('Babel failed to load.');
    if (!window.React || !window.ReactDOM) throw new Error('React failed to load.');
    var src = document.getElementById('app-src').textContent;
    var out = Babel.transform(src, {
      filename: 'app.tsx',
      presets: [['typescript', { isTSX: true, allExtensions: true }], 'react']
    }).code;
    var s = document.createElement('script');
    s.textContent = out;
    document.body.appendChild(s);
  } catch (e) { fail((e && e.message) || e); }
})();
</script>
